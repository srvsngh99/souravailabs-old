params:
  description: "Lead SDET at CRED sharing AI testing systems, quality engineering strategy, and a public 52-week GenAI learning journey."
  author: "Sourav"

  brand:
    kicker: "Talk About Me"
    title: "Sourav AI Labs"
    tagline: "Lead SDET in the Payments Platform team at CRED, building reliable software at the intersection of Quality Engineering and GenAI."
    summary: "I am Sourav Singh, based in Bangalore, India. I lead quality engineering outcomes for high-scale products, and I am documenting a 52-week public GenAI testing journey with practical lessons teams can apply immediately."
    mission:
      - "Publish practical testing + AI implementation playbooks from real delivery environments"
      - "Document my 52-week GenAI testing journey with weekly execution notes and artifacts"
      - "Share lessons for teams that need release speed without compromising trust"

  profile:
    role: "Lead SDET, Payments Platform @ CRED | Quality Engineering + GenAI Testing"
    experience: "10+ years in quality engineering"
    location: "Bangalore, India"
    image: "/images/profile.jpg"
    imageAlt: "Sourav profile photo"
    imagePosition: "50% 55%"
    imageScale: "0.90"

  social:
    github: "https://github.com/srvsngh99"
    linkedin: "https://linkedin.com/in/srv-sngh"
    youtube: "https://youtube.com/@SouravAILabs"

  analytics:
    provider: "goatcounter"
    goatcounterCode: "souravailabs"
    domain: ""
    dashboardUrl: ""
    showPublicStats: false

  learn:
    title: "Learning Library"
    subtitle: "Practical docs and notes you can read online."

  videos:
    enabled: true
    heading: "Videos"
    subtitle: "Walkthroughs, applied testing ideas, and updates from my public GenAI learning journey."
    embedTitle: "Latest videos from Sourav AI Labs"
    embedUrl: "https://www.youtube-nocookie.com/embed?listType=user_uploads&list=SouravAILabs"
    links:
      - label: "YouTube channel"
        url: "https://www.youtube.com/@SouravAILabs"
      - label: "YouTube playlists"
        url: "https://www.youtube.com/@SouravAILabs/playlists"
      - label: "GenAI Testing Journey repo"
        url: "https://github.com/srvsngh99/genai-testing-journey"

  newsletter:
    enabled: true
    provider: "buttondown"
    heading: "Blog Alerts"
    blurb: "Newsletter is work in progress. For now, get notified by email whenever a new blog is published."
    wipNote: "Upcoming newsletter themes: AI, Testing, and real-life learning experiences."
    buttonLabel: "Notify Me On New Posts"
    formAction: ""
    buttondownUsername: "souravailabs"
    formMethod: "post"
    emailFieldName: "email"
    sourceFieldName: "tag"
    sourceFieldValue: "website"
    topics:
      - "AI"
      - "Testing"
      - "Real-life learning experiences"
    spamNote: "For better inbox placement, authenticate your sender domain with SPF, DKIM, and DMARC in your provider settings."

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    noClasses: false
