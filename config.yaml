baseURL: "https://souravailabs.ai/"
title: "Sourav AI Labs"
theme: "PaperMod"

params:
  env: production
  title: "Sourav AI Labs"
  description: "Tech insights from an SDET with 10 years of experience in testing, automation, and AI"
  author: "Sourav"
  
  defaultTheme: dark
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  
  profileMode:
    enabled: true
    title: "Sourav AI Labs"
    subtitle: "because ai needs a human touch"
    buttons:
      - name: Blog
        url: posts
      - name: About
        url: about

  socialIcons:
    - name: github
      url: "https://github.com/srvsngh99"
    - name: linkedin
      url: "https://linkedin.com/in/srv-sngh""
    - name: youtube
      url: "https://youtube.com/@SouravAILabs"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
